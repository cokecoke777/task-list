<!doctype html><meta charset="utf-8"><title>Browser smoke test</title>
<iframe id="app" src="../index.html" style="width:100%;height:600px"></iframe>
<pre id="result">RUNNING</pre>
<script>
const frame = document.querySelector('#app');
let phase = 0;
frame.addEventListener('load', () => {
  const w = frame.contentWindow, d = w.document;
  const check = (ok, message) => { if (!ok) throw Error(message); };
  try {
    if (phase === 0) {
      w.localStorage.clear();
      d.querySelector('#add-task').click();
      d.querySelector('#task-title').value = '测试任务';
      d.querySelector('#task-description').value = '测试描述';
      d.querySelector('#task-priority').value = 'high';
      d.querySelector('#task-form').requestSubmit();
      check(d.querySelector('#total-count').textContent === '1', '新增任务');
      check(d.querySelector('.priority').textContent === '高优先级', '优先级');
      check(d.querySelector('.card').classList.contains('priority-high'), '整卡优先级颜色');
      const firstCard = d.querySelector('.card');
      check(w.getComputedStyle(firstCard).borderTopLeftRadius === '10px', '圆角纸纹卡片');
      check(w.getComputedStyle(firstCard).backgroundImage.includes('card-high-paper.webp'), '任务卡纸纹');
      const textLefts = [firstCard.querySelector('.priority'), firstCard.querySelector('h3'), firstCard.querySelector('p')].map(el => el.getBoundingClientRect().left);
      check(Math.max(...textLefts) - Math.min(...textLefts) < 1, '优先级标题描述左对齐');
      d.querySelector('.card').click();
      check(d.querySelector('.card').classList.contains('actions-visible'), '点击卡片显示操作');
      d.querySelector('.card-actions button').click();
      d.querySelector('#task-title').value = '已编辑任务';
      d.querySelector('#task-form').requestSubmit();
      check(d.querySelector('.card h3').textContent === '已编辑任务', '编辑任务');
      d.querySelector('#add-task').click();
      d.querySelector('#task-title').value = '排序任务';
      d.querySelector('#task-form').requestSubmit();
      const todoCards = [...d.querySelectorAll('.column.todo .card')];
      const reorderTransfer = new DataTransfer();
      todoCards[1].dispatchEvent(new DragEvent('dragstart', {bubbles:true,dataTransfer:reorderTransfer}));
      d.querySelector('.column.todo').dispatchEvent(new DragEvent('dragover', {bubbles:true,dataTransfer:reorderTransfer,clientY:todoCards[0].getBoundingClientRect().top}));
      d.querySelector('.column.todo').dispatchEvent(new DragEvent('drop', {bubbles:true,dataTransfer:reorderTransfer,clientY:todoCards[0].getBoundingClientRect().top}));
      check(d.querySelector('.column.todo .card h3')?.textContent === '已编辑任务', '同列上下排序');
      const search = d.querySelector('#task-search');
      search.value = '不存在'; search.dispatchEvent(new Event('input', {bubbles:true}));
      check(!d.querySelector('.card') && d.querySelector('.empty').textContent === '没有匹配的任务', '无搜索结果');
      check(d.querySelector('#total-count').textContent === '2', '搜索不改变总数');
      search.value = '测试描述'; search.dispatchEvent(new Event('input', {bubbles:true}));
      check(d.querySelector('.card h3')?.textContent === '已编辑任务', '描述搜索');
      search.value = '已编辑'; search.dispatchEvent(new Event('input', {bubbles:true}));
      check(d.querySelector('.card h3')?.textContent === '已编辑任务', '标题搜索');
      search.value = ''; search.dispatchEvent(new Event('input', {bubbles:true}));
      const card = d.querySelector('.card');
      const transfer = new DataTransfer();
      card.dispatchEvent(new DragEvent('dragstart', {bubbles:true,dataTransfer:transfer}));
      d.querySelector('.column.doing').dispatchEvent(new DragEvent('drop', {bubbles:true,dataTransfer:transfer}));
      check(d.querySelector('.column.doing .card h3')?.textContent === '已编辑任务', '拖拽改状态');
      d.querySelector('#theme-toggle').click();
      check(d.body.classList.contains('dark'), '深色模式');
      phase = 1; w.location.reload();
    } else {
      check(d.querySelector('.column.doing .card h3')?.textContent === '已编辑任务', '刷新后任务保留');
      check(d.body.classList.contains('dark'), '刷新后主题保留');
      w.confirm = () => true;
      d.querySelector('.card').click();
      check(d.querySelector('.card').classList.contains('actions-visible'), '刷新后卡片操作');
      d.querySelector('.card-actions .delete').click();
      check(d.querySelector('#total-count').textContent === '1', '删除任务');
      document.querySelector('#result').textContent = 'PASS: 搜索、增删改、同列排序、纸纹圆角与对齐、拖拽、深色模式、刷新持久化';
    }
  } catch (error) { document.querySelector('#result').textContent = `FAIL: ${error.message}`; }
});
</script>
